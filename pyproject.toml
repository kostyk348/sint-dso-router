[project]
name = "sint-dso-router"
version = "0.1.0"
description = "DSO Deterministic Router — hash-based task classification with zero LLM calls"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
dso-router = "server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
